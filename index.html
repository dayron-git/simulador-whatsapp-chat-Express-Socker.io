<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PA4 - Dayron Lozano</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/25d0b10283.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Chat 1 -->
  <section id="chat1"> 
    <div class="iphone-notch"></div>

    <!-- barra de estado -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span><i class="fa-solid fa-wifi"></i></span>
        <span><i class="fa-solid fa-battery-three-quarters"></i></span>
      </div>
    </div>

    <!-- Barra superior de contacto -->
    <div class="chat-header">
      <img src="/img/perfil.jpg" alt="Usuario 1" class="avatar">
      <div class="contact-info">
        <strong>Lucas</strong>
        <span class="status">en línea</span>
      </div>
      <div class="chat-actions">
        <i class="fa-solid fa-video"></i>
        <i class="fa-solid fa-phone"></i>
      </div>
    </div>

    <ul id="chat1-mensajes"></ul> 

    <!-- Formulario -->
    <form id="form1" action="">
      <input type="text" name="mensaje1" id="mensaje1" placeholder="Escribe un mensaje" autocomplete="off" />
      <button type="submit""><i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </section>


<!-- Chat 2 -->
  <section id="chat2">
  <div class="iphone-notch"></div>

  <!-- barra de estado -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span><i class="fa-solid fa-wifi"></i></span>
        <span><i class="fa-solid fa-battery-three-quarters"></i></span>
      </div>
    </div>

  <!-- Barra superior de contacto -->
  <div class="chat-header">
    <img src="/img/perfil.jpg" alt="Usuario 2" class="avatar">
    <div class="contact-info">
      <strong>Valeria</strong>
      <span class="status">en línea</span>
    </div>
    <div class="chat-actions">
      <i class="fa-solid fa-video"></i>
      <i class="fa-solid fa-phone"></i>
    </div>
  </div>

  <ul id="chat2-mensajes"></ul>

  <!-- Formulario -->
  <form id="form2" action="">
    <input type="text" name="mensaje2" id="mensaje2" placeholder="Escribe un mensaje" autocomplete="off" />
    <button type="submit"><i class="fa-solid fa-arrow-right"></i></button>
  </form>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
      const socket = io();

    const form1 = document.getElementById('form1');
    const input1 = document.getElementById('mensaje1');
    const chat1Mensajes = document.getElementById('chat1-mensajes');

    const form2 = document.getElementById('form2');
    const input2 = document.getElementById('mensaje2');
    const chat2Mensajes = document.getElementById('chat2-mensajes');

    form1.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input1.value.trim();
      if (msg) {
        socket.emit('chat message', { msg, sender: 'chat1' });
        input1.value = '';
      }
    });

    form2.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input2.value.trim();
      if (msg) {
        socket.emit('chat message', { msg, sender: 'chat2' });
        input2.value = '';
      }
    });

    socket.on('chat message', ({ msg, sender }) => {
      const li1 = document.createElement('li');
      li1.textContent = msg;
      li1.classList.add(sender === 'chat1' ? 'enviado' : 'recibido');
      chat1Mensajes.appendChild(li1);
      chat1Mensajes.scrollTop = chat1Mensajes.scrollHeight;

      const li2 = document.createElement('li');
      li2.textContent = msg;
      li2.classList.add(sender === 'chat2' ? 'enviado' : 'recibido');
      chat2Mensajes.appendChild(li2);
      chat2Mensajes.scrollTop = chat2Mensajes.scrollHeight;
    });

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
